; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:goouuu-s3-cam]
platform = espressif32
; GOOUUU ESP32-S3-CAM has no PlatformIO board definition.
; The generic ESP32-S3 definition avoids importing another board's camera/LCD pins.
board = esp32-s3-devkitc-1
framework = arduino

upload_protocol = esptool
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_upload.maximum_ram_size = 8716288
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.embed_files = index.html

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    madhephaestus/ESP32Servo @ ^3.0.9
