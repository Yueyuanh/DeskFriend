; Waveshare ESP32-S3-LCD-1.28 (non-touch).
; Borrow the touch model's PlatformIO board definition; do not enable touch input.

[env:waveshare_esp32s3_touch_lcd_128]
platform = espressif32 @ 8.0.0
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
board_build.partitions = default_16MB.csv
extra_scripts = pre:scripts/embed_assets.py
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    lvgl/lvgl @ 9.4.0
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_KCONFIG_IGNORE
    -I include
