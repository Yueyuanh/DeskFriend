<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskFriend 桌面陪伴机器人</title>
<style>
:root{--bg:#eef7f5;--ink:#1d2b2b;--teal:#8fe3d6;--lime:#e6ff4d;--coral:#ff7a6b;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;min-height:100vh}
.stage{position:relative;border-radius:20px;background:#dff3f0;overflow:hidden;min-height:480px}
#c{width:100%;height:100%;display:block;touch-action:none}
.chip{position:absolute;left:14px;top:14px;padding:6px 12px;border-radius:99px;background:var(--lime);font-weight:700}
.chip.on{background:var(--coral);color:#fff}
.panel{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
h1{margin:0;font-size:20px}h2{margin:6px 0 0;font-size:12px;letter-spacing:.06em;color:#587}
.sl{display:grid;grid-template-columns:1fr auto;gap:4px;font-weight:600}
.sl input{grid-column:1/3;accent-color:#2bb5a0;width:100%}
.row{display:flex;gap:8px}
button{font:inherit;border:0;border-radius:12px;padding:10px 12px;background:var(--teal);color:var(--ink);cursor:pointer;font-weight:600}
button.big{flex:1;background:var(--coral);color:#fff;font-size:18px;letter-spacing:.08em;touch-action:none;user-select:none}
button.big:active,button.big.down{filter:brightness(.9);transform:translateY(2px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid button{background:#eaf6f3}
.grid button.active{background:var(--lime);outline:2px solid var(--ink)}
.state{padding:8px 10px;border-radius:10px;background:#f4f8f7;font-weight:600}
.state.on{background:var(--coral);color:#fff}
.read{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}.read span{background:#f4f8f7;padding:4px 8px;border-radius:8px}
#log{margin:0;padding:0 0 0 16px;max-height:110px;overflow:auto;font-size:12px;color:#456}
.hint{margin:0;font-size:12px;color:#789}
.grid.three{grid-template-columns:repeat(3,1fr)}.grid.three button{padding:8px 2px;font-size:13px}
.snd{align-items:center}.snd input{flex:1;accent-color:#2bb5a0}.snd button{background:var(--lime)}
@media(min-width:821px){.panel{max-height:calc(100vh - 32px);overflow:auto;position:sticky;top:16px}}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:10px}.stage{height:56vh;min-height:340px}}

details{border-top:1px solid #e3eeec;padding-top:6px}summary{cursor:pointer;font-weight:700;font-size:13px;color:#456;padding:4px 0}details>*:not(summary){margin-top:6px}
input[type=text]{font:inherit;width:100%;padding:8px 10px;border:2px solid #cfe6e1;border-radius:10px;background:#fbfffe}
.two{display:grid;grid-template-columns:90px 1fr;gap:6px}.cnt{display:flex;justify-content:space-between;align-items:center;font-size:12px}
#cam{position:absolute;right:12px;bottom:12px;width:128px;border-radius:12px;border:3px solid var(--lime);transform:scaleX(-1);background:#000}
.grid button.active,button.active{background:var(--lime);outline:2px solid var(--ink)}

</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<main class="app">
  <section class="stage"><canvas id="c" aria-label="DeskFriend 3D"></canvas><div class="chip" id="chip">待机</div><video id="cam" playsinline muted hidden></video></section>
  <aside class="panel">
    <h1>DeskFriend</h1>
    <label class="sl">YAW 左右 <output id="yawOut">0°</output><input id="yaw" type="range" min="-45" max="45" step="1" value="0"></label>
    <label class="sl">PITCH 上下 <output id="pitchOut">0°</output><input id="pitch" type="range" min="-20" max="20" step="1" value="0"></label>
    <div class="row"><button id="press" class="big">PRESS</button><button id="center">回中</button></div>
    <div class="row snd"><button id="snd" data-on="1">音效：开</button><input id="vol" type="range" min="0" max="1" step=".05" value=".5" aria-label="音量"></div>
    <div class="state" id="pressState">按压状态：未按下</div>
    <div class="read"><span>YAW <b id="rYaw">0.0</b></span><span>PITCH <b id="rPitch">0.0</b></span><span>INPUT <b id="rIn">IDLE</b></span></div>
    <details open><summary>灵动动作</summary><div class="grid three" id="acts"></div><p class="hint">点击机器人头部 = 随机动作；PRESS / Space / Enter = 触发选中项（选「随机」则每次随机）</p></details>
    <details><summary>话术表情（文字 + 动作 + 音效）</summary><div class="grid three" id="phr"></div></details>
    <details><summary>自身状态（电量 / 开机 / 网络）</summary><div class="grid three" id="sta"></div></details>
    <details><summary>朋友消息（自定义文字）</summary>
      <div class="two"><input type="text" id="chatName" maxlength="6" value="小可爱" aria-label="昵称"><input type="text" id="chatText" maxlength="200" placeholder="想对屏幕说点什么…" aria-label="消息"></div>
      <div class="cnt"><span id="chatCnt">0/60</span><button id="chatSend">发送到屏幕</button></div><div class="grid three" id="chips"></div></details>
    <details><summary>像素火柴人</summary><button id="stickBtn">像素火柴人：关</button><div class="grid three" id="sanims"></div>
      <button id="camBtn">开启摄像头同步</button><p class="hint" id="camState">未开启</p></details>
    <details><summary>基础表情</summary><div class="grid three" id="exprs"></div></details>
    <details open><summary>事件日志</summary><ul id="log"></ul></details>
    <p class="hint">拖拽旋转视角 · 点击头部随机动作</p>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// 程序化音效（WebAudio 合成，无外部音频文件）。条目：[频率Hz, 起始秒, 时长秒, {type, to(滑音目标), g(音量), vib(颤音), bell(钟声泛音)}]
const SND = {
  press: [[180, 0, .07, { type: 'triangle', to: 90, g: .5 }]], release: [[420, 0, .08, { type: 'triangle', to: 640, g: .4 }]], blip: [[660, 0, .06, { g: .25 }]],
  hi: [[523, 0, .12], [659, .1, .12], [784, .2, .3, { g: .4 }]],
  curious: [[440, 0, .12, { to: 520 }], [587, .14, .2, { to: 740 }]],
  happy: [[392, 0, .1, { to: 560 }], [392, .28, .1, { to: 560 }], [523, .56, .1, { to: 740 }], [523, .84, .1, { to: 740 }]],
  shy: [[880, 0, .08, { to: 1040, g: .2 }], [988, .1, .08, { to: 1175, g: .2 }], [784, .3, .2, { to: 659, g: .18, vib: 1 }]],
  eat: [[170, 0, .07, { type: 'triangle', to: 90, g: .6 }], [170, .22, .07, { type: 'triangle', to: 90, g: .6 }], [170, .44, .07, { type: 'triangle', to: 90, g: .6 }], [170, .66, .07, { type: 'triangle', to: 90, g: .6 }], [523, .9, .1], [659, 1, .25]],
  water: [[400, 0, .09, { to: 900, g: .3 }], [500, .14, .09, { to: 1100, g: .3 }], [350, .3, .1, { to: 800, g: .3 }], [784, .52, .2, { g: .3 }]],
  off: [[523, 0, .1], [659, .1, .1], [784, .2, .1], [1047, .3, .5, { g: .4 }], [784, .3, .5, { type: 'triangle', g: .25 }], [659, .3, .5, { type: 'triangle', g: .25 }]],
  energy: [[330, 0, .08, { type: 'square', g: .14, to: 660 }], [440, .08, .08, { type: 'square', g: .14 }], [554, .16, .08, { type: 'square', g: .14 }], [659, .24, .08, { type: 'square', g: .14 }], [880, .32, .35, { type: 'square', g: .16 }]],
  night: [[392, 0, .5, { type: 'triangle', g: .3 }], [330, .5, .5, { type: 'triangle', g: .3 }], [262, 1, .9, { type: 'triangle', g: .3 }]],
  thanks: [[392, 0, .2, { type: 'triangle', g: .3 }], [523, .2, .45, { type: 'triangle', g: .3 }]],
  miss: [[880, 0, .5, { to: 740, vib: 1, g: .25 }], [784, .5, .7, { to: 659, vib: 1, g: .22 }]],
  msg: [[1319, 0, .4, { g: .35, bell: 1 }], [1047, .18, .6, { g: .35, bell: 1 }]],
  cheer: [[392, 0, .12, { type: 'square', g: .14 }], [392, .15, .12, { type: 'square', g: .14 }], [523, .3, .4, { type: 'square', g: .16 }]],
  sleepy: [[500, 0, 1.3, { to: 200, vib: 1, g: .25 }]], wow: [[300, 0, .25, { to: 1200, g: .35 }]],
  sad: [[392, 0, .3, { type: 'triangle', to: 370 }], [311, .35, .7, { type: 'triangle', to: 280, g: .3 }]],
  love: [[1047, 0, .15, { g: .25 }], [1319, .12, .15, { g: .25 }], [1568, .24, .5, { g: .25 }], [2093, .36, .4, { g: .12 }]],
  yes: [[523, 0, .08, { to: 600 }], [659, .12, .14, { to: 760 }]],
  no: [[330, 0, .1, { type: 'triangle', to: 280 }], [294, .16, .18, { type: 'triangle', to: 240 }]],
  look: [[600, 0, .06, { g: .25 }], [720, .18, .06, { g: .25 }], [600, .4, .06, { g: .25 }]],
  peek: [[900, 0, .05, { g: .2 }], [1100, .1, .08, { g: .2, to: 1300 }]],
  dance: [[392, 0, .1], [494, .18, .1], [587, .36, .1], [494, .54, .1], [392, .72, .1], [523, .9, .2]],
  think: [[440, 0, .35, { to: 520, vib: 1, g: .22 }], [494, .4, .4, { to: 440, vib: 1, g: .2 }]],
  wink: [[700, 0, .05, { g: .25 }], [1400, .08, .12, { g: .3, to: 1800 }]],
  scared: [[800, 0, .5, { type: 'triangle', vib: 1, g: .2, to: 600 }]],
  smug: [[330, 0, .15, { type: 'triangle' }], [392, .2, .15, { type: 'triangle' }], [330, .4, .3, { type: 'triangle', to: 300 }]],
  dizzy: [[600, 0, .7, { to: 300, vib: 1, g: .22 }], [300, .7, .5, { to: 500, vib: 1, g: .2 }]],
  lowbat: [[523, 0, .18, { type: 'triangle', g: .3 }], [392, .22, .18, { type: 'triangle', g: .3 }], [294, .44, .2, { type: 'triangle', g: .28 }], [196, .7, .9, { type: 'triangle', to: 120, g: .28 }]],
  charging: [[262, 0, .15, { type: 'triangle', g: .25 }], [330, .2, .15, { type: 'triangle', g: .25 }], [392, .4, .15, { type: 'triangle', g: .25 }], [523, .6, .4, { type: 'triangle', g: .28 }]],
  full: [[523, 0, .1], [659, .1, .1], [784, .2, .1], [1047, .3, .12], [1319, .42, .5, { g: .4, bell: 1 }]],
  boot: [[392, 0, .12, { g: .3 }], [523, .14, .12, { g: .3 }], [659, .28, .12], [1047, .42, .4, { g: .35 }]],
  offline: [[440, 0, .12, { type: 'square', g: .12 }], [330, .2, .2, { type: 'square', g: .12 }]],
};
let ctx, master, on = true, vol = .5;
function init() {
  if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = vol * .6;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000; master.connect(lp); lp.connect(ctx.destination); }
  if (ctx.state === 'suspended') ctx.resume();
}
function tone(f, s, d, o, t0) {
  const { type = 'sine', to, g = .35, vib, bell } = o || {}, t = t0 + s, osc = ctx.createOscillator(), a = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t); if (to) osc.frequency.exponentialRampToValueAtTime(to, t + d);
  if (vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 6; lg.gain.value = f * .02; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + .1); }
  a.gain.setValueAtTime(.0001, t); a.gain.exponentialRampToValueAtTime(g, t + .012); a.gain.exponentialRampToValueAtTime(.0001, t + d + (bell ? .3 : .08));
  osc.connect(a); a.connect(master); osc.start(t); osc.stop(t + d + .4);
  if (bell) tone(f * 2.4, s, d * .6, { g: g * .4 }, t0);
}
const sfx = {
  init,
  play(n) { if (!on || !ctx || !SND[n]) return; if (ctx.state === 'suspended') ctx.resume(); const t0 = ctx.currentTime + .01; for (const [f, s, d, o] of SND[n]) tone(f, s, d, o, t0); },
  setOn(v) { on = v; }, setVol(v) { vol = v; if (master) master.gain.value = v * .6; },
};

// 屏幕绘制：240×240 圆屏。face=表情，text=底部文字，T=全局时间，age=本次动作已播放秒数
const P = Math.PI, C = '#f3efe0', BG = '#0c171b', CO = '#ff7a6b';
const GLOW = { wink: 0xffc15e, think: 0x9aa8ff, scared: 0x6fd0ff, dance: 0xe6ff4d, dizzy: 0xff9a3d, no: 0xff7a6b, lowbat: 0xff5a4d, charging: 0xe6ff4d, full: 0x8fe38a, boot: 0x8fe3d6, offline: 0x8896a0, chat: 0xff9ab8, stick: 0xe6ff4d, idle: 0x8fe3d6, happy: 0xe6ff4d, curious: 0x8fe3d6, shy: 0xff9a8f, pressed: 0xff7a6b, greeting: 0xe6ff4d,
  eat: 0xffc15e, water: 0x6fd0ff, off: 0xe6ff4d, energy: 0xe6ff4d, night: 0x7a8cff, thanks: 0xff9a8f, miss: 0xff7aa8,
  msg: 0x6fd0ff, cheer: 0xff9a3d, sleepy: 0x9aa8ff, wow: 0xffe14d, sad: 0x6f8cb8, love: 0xff6f9a };
const EXPR_NAMES = { idle: '柔和待机', happy: '开心', curious: '好奇', shy: '害羞', pressed: '按压中', greeting: '收到问候' };
const BLUSH = { shy: 1.3, thanks: 1.2, love: 1.15, sad: 0.35, wow: 0.6, night: 0.7, sleepy: 0.7 };
const hex = n => '#' + n.toString(16).padStart(6, '0');

function drawScreen(g, face, text, T, age, blink) {
  const b = blink ? 0.12 : 1, sn = Math.sin;
  const rs = () => { g.strokeStyle = g.fillStyle = C; g.lineWidth = 9; g.globalAlpha = 1; };
  const eye = (x, y, w, h) => { g.beginPath(); g.ellipse(x, y, w, Math.max(h, 2), 0, 0, 7); g.fill(); };
  const arc = (x, y, r, a, c) => { g.beginPath(); g.arc(x, y, r, a, c); g.stroke(); };
  const line = (a, b2, c, d) => { g.beginPath(); g.moveTo(a, b2); g.lineTo(c, d); g.stroke(); };
  const heart = (x, y, s, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(x, y + s * .35); g.bezierCurveTo(x - s, y - s * .3, x - s * .5, y - s, x, y - s * .45); g.bezierCurveTo(x + s * .5, y - s, x + s, y - s * .3, x, y + s * .35); g.fill(); };
  const star = (x, y, s, col) => { g.fillStyle = col; g.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .35 : s, a = i * P / 4 - P / 2; g.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); } g.fill(); };
  const drop = (x, y, s, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(x, y - s * 1.4); g.bezierCurveTo(x + s * .4, y - s * .5, x + s, y, x + s, y + s * .45); g.arc(x, y + s * .45, s, 0, P); g.bezierCurveTo(x - s, y, x - s * .4, y - s * .5, x, y - s * 1.4); g.fill(); };
  const zz = () => { for (let i = 0; i < 2; i++) { const p = (T * .5 + i * .5) % 1; g.globalAlpha = sn(P * p); g.fillStyle = '#9aa8ff'; g.font = `bold ${12 + 8 * p}px sans-serif`; g.textAlign = 'center'; g.fillText('Z', 150 + p * 24 + i * 4, 100 - p * 40); } };
  const happyEyes = (y = 104, r = 20) => { arc(82, y, r, P * 1.1, P * 1.9); arc(158, y, r, P * 1.1, P * 1.9); };
  const batt = (cx, cy, lv, col) => { g.strokeStyle = C; g.lineWidth = 6; g.strokeRect(cx - 38, cy - 16, 72, 32); g.fillStyle = C; g.fillRect(cx + 36, cy - 6, 6, 12); g.fillStyle = col; g.fillRect(cx - 32, cy - 10, 60 * Math.max(0, Math.min(1, lv)), 20); };

  g.save(); g.clearRect(0, 0, 240, 240); g.beginPath(); g.arc(120, 120, 120, 0, 7); g.clip();
  g.fillStyle = BG; g.fillRect(0, 0, 240, 240); g.lineCap = g.lineJoin = 'round'; rs();
  if (face === 'chat' || face === 'stick') { face === 'chat' ? drawChat(g, T, age) : drawStick(g, T);
    g.globalAlpha = 1; g.strokeStyle = hex(GLOW[face]); g.lineWidth = 10; g.beginPath(); g.arc(120, 120, 114, 0, 7); g.stroke(); g.restore(); return; }
  g.save();
  if (text) { g.translate(120, 106); g.scale(.8, .8); g.translate(-120, -112); }
  switch (face) {
    case 'happy': happyEyes(112, 22); arc(120, 128, 36, P * .12, P * .88); break;
    case 'curious': eye(78, 104, 17, 22 * b); eye(162, 98, 25, 31 * b); g.beginPath(); g.ellipse(120, 168, 9, 12, 0, 0, 7); g.stroke(); break;
    case 'shy': arc(82, 96, 20, P * .1, P * .9); arc(158, 96, 20, P * .1, P * .9);
      g.beginPath(); g.moveTo(98, 166); g.quadraticCurveTo(110, 156, 120, 166); g.quadraticCurveTo(130, 176, 142, 166); g.stroke(); break;
    case 'pressed': g.beginPath(); g.moveTo(62, 84); g.lineTo(100, 106); g.lineTo(62, 128); g.moveTo(178, 84); g.lineTo(140, 106); g.lineTo(178, 128); g.stroke(); line(104, 166, 136, 166); break;
    case 'greeting': eye(82, 100, 20, 26 * b); eye(158, 100, 20, 26 * b); g.beginPath(); g.arc(120, 142, 34, 0, P); g.fill();
      g.fillStyle = CO; g.beginPath(); g.arc(120, 168, 16, 0, P); g.fill();
      if (!text) { g.fillStyle = C; g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.fillText('Hi!', 120, 212); } break;
    case 'eat': { happyEyes(100, 18); const o = 5 + 9 * Math.abs(sn(T * 11)); g.fillStyle = CO; g.beginPath(); g.ellipse(120, 138, 16, o, 0, 0, 7); g.fill();
      g.fillStyle = '#f6eedd'; g.beginPath(); g.arc(120, 160, 42, 0, P); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(120, 160, 32, P, 0); g.fill();
      g.strokeStyle = '#ffc15e'; g.lineWidth = 5; line(138, 150, 172, 112 + 2 * sn(T * 11)); line(148, 156, 182, 120 + 2 * sn(T * 11)); } break;
    case 'water': eye(82, 104, 14, 20 * b); eye(158, 104, 14, 20 * b); arc(120, 136, 20, P * .15, P * .85);
      drop(186, 62 + 4 * sn(T * 4), 16, '#6fd0ff'); drop(52, 40 + (T * 50) % 70, 9, 'rgba(111,208,255,.6)'); break;
    case 'off': happyEyes(102, 19); g.beginPath(); g.arc(120, 126, 30, 0, P); g.closePath(); g.fill(); g.fillStyle = CO; g.beginPath(); g.ellipse(120, 146, 14, 8, 0, 0, 7); g.fill();
      for (let i = 0; i < 7; i++) { g.save(); g.translate(30 + i * 30, (T * 70 + i * 43) % 150 + 8); g.rotate(T * 4 + i); g.fillStyle = ['#ff7a6b', '#e6ff4d', '#8fe3d6'][i % 3]; g.fillRect(-4, -2, 8, 4); g.restore(); } break;
    case 'energy': { const s = 20 + 3 * sn(T * 10); star(82, 100, s, C); star(158, 100, s, C); arc(120, 128, 28, P * .12, P * .88);
      g.fillStyle = '#e6ff4d'; g.beginPath(); [[182, 34], [162, 70], [176, 70], [166, 102], [196, 60], [180, 60]].forEach(([x, y], i) => i ? g.lineTo(x, y + 2 * sn(T * 14)) : g.moveTo(x, y)); g.fill(); } break;
    case 'night': arc(82, 104, 18, P * .12, P * .88); arc(158, 104, 18, P * .12, P * .88); arc(120, 138, 10, P * .15, P * .85);
      g.fillStyle = '#ffe9a8'; g.beginPath(); g.arc(184, 58, 16, 0, 7); g.fill(); g.fillStyle = BG; g.beginPath(); g.arc(191, 53, 14, 0, 7); g.fill(); zz(); break;
    case 'thanks': happyEyes(102, 18); arc(120, 128, 24, P * .15, P * .85);

  S.time += dt; S.age += dt;
  const off = { yaw: 1.6 * Math.sin(S.time * .7), pitch: 1.1 * Math.sin(S.time * 1.1 + 1), hop: 0 }; // 待机呼吸感
  if (S.anim) { const a = ACTIONS[S.anim.id]; S.anim.t += dt / a.dur; const o = a.f(Math.min(S.anim.t, 1)); off.yaw += o.yaw; off.pitch += o.pitch;
    if (S.anim.t >= 1) { S.expr = a.after || a.face; S.text = a.after ? '' : a.text; S.exprTimer = S.expr === 'idle' ? 0 : 1.4; S.anim = null; if (!S.pressed) S.input = 'IDLE'; log('动作完成'); } }
  off.yaw += S.syncYaw; off.pitch += S.syncPitch; camStep();
  const k = 1 - Math.exp(-dt * CFG.servoSpeed);
  S.yaw += (clamp(S.yawT + off.yaw, -CFG.limits.yaw, CFG.limits.yaw) - S.yaw) * k;
  S.pitch += (clamp(S.pitchT + off.pitch, -CFG.limits.pitch, CFG.limits.pitch) - S.pitch) * k;
  S.press += ((S.pressed ? 1 : 0) - S.press) * (1 - Math.exp(-dt * CFG.press.speed));
  if (S.exprTimer > 0 && (S.exprTimer -= dt) <= 0) { S.expr = 'idle'; S.text = ''; }

  // 机械：整个 upperAssembly 一起下沉；按键同步压缩；base 固定
  R.upperAssembly.position.y = REST_Y - S.press * CFG.press.drop;
  R.pressButton.position.y = CFG.base.h + CFG.button.h / 2 - S.press * CFG.press.drop;
  R.yawPivot.rotation.y = rad(S.yaw);
  R.pitchPivot.rotation.x = -rad(S.pitch); // 正值 = 抬头

  const cur = S.anim && ACTIONS[S.anim.id];
  const shown = S.pressed ? 'pressed' : cur ? cur.face : (S.mode === 'stick' && S.exprTimer <= 0 ? 'stick' : S.expr), text = (S.pressed || shown === 'stick') ? '' : cur ? cur.text : S.text;
  S.nextBlink -= dt; if (S.nextBlink < 0) { S.blink = 0.12; S.nextBlink = 2 + Math.random() * 3; } S.blink = Math.max(0, S.blink - dt);
  drawScreen(sctx, shown, text, S.time, S.age, S.blink > 0); screenTex.needsUpdate = true;
  if (cur === ACTIONS.chat) { const p = chatPage(S.age); if (p !== S.page) { S.page = p; if (p > 0) sfx.play('blip'); } } else S.page = -1;
  R.glowMat.emissive.setHex(GLOW[shown]); R.glowMat.emissiveIntensity = 0.3 + 1.3 * S.press + (S.anim ? 0.4 : 0);
  R.led.material.emissiveIntensity = 0.4 + 2 * S.press;

  const pr = S.pressed;
  $('chip').textContent = pr ? '按压中' : cur ? cur.name : shown === 'stick' ? (CAM.on ? '火柴人 · 同步中' : '像素火柴人') : (text || EXPR_NAMES[S.expr] || '待机'); $('chip').classList.toggle('on', pr);
  $('pressState').textContent = '按压状态：' + (pr ? '按压中' : '未按下'); $('pressState').classList.toggle('on', pr);
  $('rYaw').textContent = S.yaw.toFixed(1); $('rPitch').textContent = S.pitch.toFixed(1); $('rIn').textContent = S.input;
  for (const b of $('exprs').children) b.classList.toggle('active', b.dataset.k === shown);

  controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
buildButtons(); resize(); log('DeskFriend 就绪');
window.deskFriend = { ACTIONS, S, R, CFG, pressDown, pressUp, startAction }; // 便于自动化验证
frame();

</script>
